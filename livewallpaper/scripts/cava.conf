# cava.conf (Music Dock)
# -------------------------------------------------------------------------
# Template consumed by start_cava.sh -- __BARS__/__FRAMERATE__/__SENSITIVITY__/
# __FIFO__ are substituted with sed into a real per-session config written
# to Paths.cavaConfFile before cava is launched. Not meant to be used
# as-is (the placeholders are not valid cava config values).
#
# Output is raw binary, one unsigned byte (0-255) per bar, written into a
# FIFO -- read continuously by scripts/_cava_reader.py and forwarded to
# CavaService.qml as JSON frames. See CavaService.qml's header for the
# full PipeWire -> cava -> FIFO -> QML pipeline.

[general]
bars = __BARS__
framerate = __FRAMERATE__
autosens = 1
sensitivity = __SENSITIVITY__

# PipeWire ships a pulseaudio-compatible server (pipewire-pulse); cava's
# "pulse" input talks to it exactly like a real PulseAudio server, so
# this is the real PipeWire -> cava audio path, not a fallback.
[input]
method = pulse
source = auto

[output]
method = raw
raw_target = __FIFO__
data_format = binary
bit_format = 8bit
channels = mono

[smoothing]
monstercat = 1
waves = 0
noise_reduction = 77
